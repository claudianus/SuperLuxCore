# GPU eye-path-only dispersion reference (no light tracing; the caustic is
# then reachable only through eye-side MNEE connects to the point light)
film.width = 1280
film.height = 720
image.filename = /tmp/ltdisp/gpu_eye.png
batch.halttime = 0
batch.haltspp = 256
scene.file = scenes/cornell/lt-dispersion.scn
renderengine.type = PATHOCL
sampler.type = SOBOL
filter.type = GAUSSIAN
opencl.cpu.use = 0
opencl.gpu.use = 1
opencl.gpu.workgroup.size = 64
opencl.native.threads.count = 0
screen.refresh.interval = 1000
path.spectral.enable = 1
path.maxdepth = 8
path.lighttracing.enable = 0
path.mnee.enable = 1
path.mnee.maxspecular = 4
film.imagepipeline.0.type = TONEMAP_LINEAR
film.imagepipeline.1.type = GAMMA_CORRECTION
film.imagepipeline.1.value = 2.2
