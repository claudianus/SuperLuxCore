film.width = 1280
film.height = 720
image.filename = /tmp/lmnee/slab_on.png
batch.halttime = 0
batch.haltspp = 96
scene.file = scenes/cornell/lmnee-slab.scn
renderengine.type = PATHOCL
sampler.type = SOBOL
