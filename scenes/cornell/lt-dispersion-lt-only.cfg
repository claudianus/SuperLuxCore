# GPU light-tracing-only dispersion caustic (all pixels are light-path
# splats through the dispersive sphere + LMNEE connects)
film.width = 1280
film.height = 720
image.filename = /tmp/ltdisp/gpu_ltonly.png
batch.halttime = 0
batch.haltspp = 256
scene.file = scenes/cornell/lt-dispersion.scn
renderengine.type = PATHOCL
sampler.type = SOBOL
filter.type = GAUSSIAN
opencl.cpu.use = 0
opencl.gpu.use = 1
opencl.gpu.workgroup.size = 64
# No native CPU eye threads: they would mask the GPU light-tracing result
opencl.native.threads.count = 0
screen.refresh.interval = 1000
path.spectral.enable = 1
path.maxdepth = 8
light.maxdepth = 8
path.lighttracing.enable = 1
path.lighttracing.taskfraction = 1.0
path.lighttracing.only = 1
path.mnee.enable = 1
path.mnee.maxspecular = 4
film.imagepipeline.0.type = TONEMAP_LINEAR
film.imagepipeline.1.type = GAMMA_CORRECTION
film.imagepipeline.1.value = 2.2
path.mnee.maxiterations = 64
