# Kitchen interior — Vulkan PATHOCL + OCIO filmic pipelines.
# Pipeline 0: OIDN denoise -> AgX view + "AgX - Punchy" look (sRGB)
# Pipeline 1: OIDN denoise -> ACES 2.0 view (sRGB)
# Run from the repo root:
#   luxcoreconsole -e "001" -f scenes/kitchen/kitchen-agx-vulkan.cfg
# (opencl.devices.select is passed on the command line so the string
#  matches this machine's enumeration order.)

scene.file = scenes/kitchen/kitchen-hdr.scn
renderengine.type = "PATHOCL"
sampler.type = "SOBOL"
film.width = 1280
film.height = 720
film.filter.type = "BLACKMANHARRIS"
film.filter.width = 1.5
path.pathdepth.diffuse = 5
path.pathdepth.glossy = 5
path.pathdepth.specular = 8
path.pathdepth.total = 10
path.clamping.variance.maxvalue = 64
lightstrategy.type = "LOG_POWER"
batch.haltspp = 128
screen.refresh.interval = 2000
film.opencl.enable = 0
film.opencl.device = 0
film.outputs.0.type = "RGB_IMAGEPIPELINE"
film.outputs.0.index = 0
film.outputs.0.filename = "kitchen-agx.png"
film.outputs.1.type = "RGB_IMAGEPIPELINE"
film.outputs.1.index = 1
film.outputs.1.filename = "kitchen-aces2.png"
################################################################################
# Pipeline 0: denoise -> AgX Base Rec.1886 view + Punchy look
film.imagepipelines.0.0.type = "INTEL_OIDN"
film.imagepipelines.0.0.oidnmemory = 6000
film.imagepipelines.0.1.type = "TONEMAP_OPENCOLORIO"
film.imagepipelines.0.1.mode = "DISPLAY_CONVERSION"
film.imagepipelines.0.1.config = "/Applications/Blender.app/Contents/Resources/5.2/datafiles/colormanagement/config.ocio"
film.imagepipelines.0.1.src = "Linear Rec.709"
film.imagepipelines.0.1.display = "sRGB"
film.imagepipelines.0.1.view = "AgX"
film.imagepipelines.0.1.look = "AgX - Punchy"
################################################################################
# Pipeline 1: denoise -> ACES 2.0 Rec.1886 view
film.imagepipelines.1.0.type = "INTEL_OIDN"
film.imagepipelines.1.0.oidnmemory = 6000
film.imagepipelines.1.1.type = "TONEMAP_OPENCOLORIO"
film.imagepipelines.1.1.mode = "DISPLAY_CONVERSION"
film.imagepipelines.1.1.config = "/Applications/Blender.app/Contents/Resources/5.2/datafiles/colormanagement/config.ocio"
film.imagepipelines.1.1.src = "Linear Rec.709"
film.imagepipelines.1.1.display = "sRGB"
film.imagepipelines.1.1.view = "ACES 2.0"
