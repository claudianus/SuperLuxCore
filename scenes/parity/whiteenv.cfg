# Opaque-occlusion regression config.
# A matte black quad (kd=0, no emission) directly in front of the camera,
# against a white constantinfinite environment. If camera->quad intersection
# leaks, the center pixel picks up environment light. Expected center: (0,0,0).
scene.file = "scenes/parity/whiteenv.scn"
sampler.type = "RANDOM"
batch.haltspp = "8"
film.width = "128"
film.height = "128"
film.outputs.1.type = "RGB"
film.outputs.1.filename = "whiteenv.hdr"
film.imagepipelines.0.1.type = NOP
