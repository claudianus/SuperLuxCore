# rayinfo CPU/GPU emission-parity regression config.
# Renders a quad whose emission is gated by rayinfo/iscameraray over a matte
# floor in a white environment. Expected center pixel: (4,0,0) on every
# intersection backend; the floor must not pick up red GI from the quad.
scene.file = "scenes/parity/rayinfo-camera.scn"
sampler.type = "RANDOM"
batch.haltspp = "8"
film.width = "128"
film.height = "128"
film.outputs.1.type = "RGB"
film.outputs.1.filename = "rayinfo-camera.hdr"
film.imagepipelines.0.1.type = NOP
