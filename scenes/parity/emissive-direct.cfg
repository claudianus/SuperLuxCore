# CPU/GPU emission-parity regression config.
# Renders a single directly-visible emissive quad (gain 4) on a black
# background. Expected center pixel: (4,4,4) on every intersection backend.
scene.file = "scenes/parity/emissive-direct.scn"
sampler.type = "RANDOM"
batch.haltspp = "8"
film.width = "128"
film.height = "128"
film.outputs.1.type = "RGB"
film.outputs.1.filename = "emissive-direct.hdr"
film.imagepipelines.0.1.type = NOP
