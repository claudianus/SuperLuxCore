name: DLSS initialization transaction acceptance
on:
  push:
    branches: [review/dlss-init-transaction-20261019]
permissions:
  contents: read
jobs:
  host-init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python dev-tools/dlss_init_transaction_test.py --out init-fixed.json
      - run: python dev-tools/dlss_runtime_cleanup_test.py --out teardown-fixed.json
      - run: python dev-tools/film_cleanup_ownership_test.py --out film-reference-model-fixed.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dlss-init-host
          path: '*-fixed.json'
  windows-helper:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python dev-tools/dlss_init_transaction_test.py --msvc --out windows-init-fixed.json
      - run: python dev-tools/dlss_init_transaction_test.py --msvc --no-console --out windows-gui-init-fixed.json
      - run: python dev-tools/dlss_runtime_cleanup_test.py --msvc --out windows-teardown-fixed.json
      - run: python dev-tools/dlss_runtime_cleanup_test.py --msvc --no-console --out windows-gui-teardown-fixed.json
      - uses: actions/checkout@v6
        with:
          repository: NVIDIA/DLSS
          ref: 9981c6350dc58c0ce21f024fd65e31e851c31689
          path: .dlss-sdk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /include/
            /LICENSE.txt
            /lib/Windows_x86_64/rel/nvngx_dlssd.dll
      - name: Verify official runtime signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .dlss-sdk/lib/Windows_x86_64/rel/nvngx_dlssd.dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'NVIDIA') { throw 'Invalid NVIDIA signature' }
      - name: Build only the separate DLSS helper
        shell: pwsh
        run: |
          cmake -S src/slg/film/denoiser/dlss -B out/dlss -A x64 "-DDLSS_ROOT=$env:GITHUB_WORKSPACE/.dlss-sdk" "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/out/dlss-install" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/dlss --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install out/dlss --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: ABI load and native driver-discovery smoke without feature evaluation
        shell: python
        run: |
          import ctypes as C,hashlib,json,os,pathlib,tempfile
          libpath=pathlib.Path('out/dlss-install/superluxcore_dlss.dll').resolve()
          lib=C.CDLL(str(libpath));lib.slc_dlss_abi.restype=C.c_uint32
          assert lib.slc_dlss_abi()==1
          lib.slc_dlss_create.argtypes=[C.c_uint32,C.c_char_p,C.c_char_p,C.c_uint64,C.c_char_p,C.c_uint32];lib.slc_dlss_create.restype=C.c_void_p
          lib.slc_dlss_destroy.argtypes=[C.c_void_p];lib.slc_dlss_destroy.restype=None
          with tempfile.TemporaryDirectory(prefix='slc-init-abi-') as cache:
              message=C.create_string_buffer(1024)
              handle=lib.slc_dlss_create(0,os.fsencode(pathlib.Path('.dlss-sdk/lib/Windows_x86_64/rel').resolve()),os.fsencode(cache),4096,message,len(message))
              if not handle: assert message.value
              lib.slc_dlss_destroy(handle);lib.slc_dlss_destroy(None)
          pathlib.Path('helper-abi.json').write_text(json.dumps(dict(ABI=1,create_returned_handle=bool(handle),create_error=message.value.decode('utf8',errors='replace'),NGX_evaluations=0,helper_sha256=hashlib.sha256(libpath.read_bytes()).hexdigest(),source_sha256=hashlib.sha256(pathlib.Path('src/slg/film/denoiser/dlss/runtime.cpp').read_bytes()).hexdigest(),scope='Actual DLL build/load/create-discovery/close only; mock tests do not certify RTX or driver recovery'),indent=2))
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dlss-init-windows-helper
          path: |
            *-fixed.json
            helper-abi.json
            out/dlss-install/*
