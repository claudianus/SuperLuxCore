name: DLSS frame publication transaction acceptance
on:
  push:
    branches: [review/dlss-frame-transaction-20261019]
permissions:
  contents: read
jobs:
  host-init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python dev-tools/dlss_frame_transaction_test.py --out frame-fixed.json
      - run: python dev-tools/dlss_init_transaction_test.py --out init-fixed.json
      - run: python dev-tools/dlss_runtime_cleanup_test.py --out teardown-fixed.json
      - run: python dev-tools/film_cleanup_ownership_test.py --out film-reference-model-fixed.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dlss-frame-host
          path: '*-fixed.json'
  windows-helper:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python dev-tools/dlss_frame_transaction_test.py --msvc --out windows-frame-fixed.json
      - run: python dev-tools/dlss_frame_transaction_test.py --msvc --no-console --out windows-gui-frame-fixed.json
      - run: python dev-tools/dlss_init_transaction_test.py --msvc --out windows-init-fixed.json
      - run: python dev-tools/dlss_init_transaction_test.py --msvc --no-console --out windows-gui-init-fixed.json
      - run: python dev-tools/dlss_runtime_cleanup_test.py --msvc --out windows-teardown-fixed.json
      - run: python dev-tools/dlss_runtime_cleanup_test.py --msvc --no-console --out windows-gui-teardown-fixed.json
      - uses: actions/checkout@v6
        with:
          repository: NVIDIA/DLSS
          ref: 9981c6350dc58c0ce21f024fd65e31e851c31689
          path: .dlss-sdk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /include/
            /LICENSE.txt
            /lib/Windows_x86_64/rel/nvngx_dlssd.dll
      - name: Verify official runtime signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .dlss-sdk/lib/Windows_x86_64/rel/nvngx_dlssd.dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'NVIDIA') { throw 'Invalid NVIDIA signature' }
      - name: Build only the separate DLSS helper
        shell: pwsh
        run: |
          cmake -S src/slg/film/denoiser/dlss -B out/dlss -A x64 "-DDLSS_ROOT=$env:GITHUB_WORKSPACE/.dlss-sdk" "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/out/dlss-install" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/dlss --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install out/dlss --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Built helper ABI and invalid-frame contract
        run: python dev-tools/dlss_helper_smoke.py --library out/dlss-install/superluxcore_dlss.dll --runtime .dlss-sdk/lib/Windows_x86_64/rel --out helper-abi.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dlss-frame-windows-helper
          path: |
            *-fixed.json
            helper-abi.json
            out/dlss-install/*
  linux-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v6
        with:
          repository: NVIDIA/DLSS
          ref: 9981c6350dc58c0ce21f024fd65e31e851c31689
          path: .dlss-sdk
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /include/
            /LICENSE.txt
            /lib/Linux_x86_64/rel/libnvidia-ngx-dlssd.so.310.9.16
      - name: Build and validate helper in the glibc 2.28 baseline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project quay.io/pypa/manylinux_2_28_x86_64 bash -euxo pipefail -c '
            export CC=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
            export CXX=/opt/rh/gcc-toolset-14/root/usr/bin/g++
            cmake -S src/slg/film/denoiser/dlss -B out/dlss-linux -DCMAKE_BUILD_TYPE=Release -DDLSS_ROOT=/project/.dlss-sdk -DCMAKE_INSTALL_PREFIX=/project/out/dlss-linux-install -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc -pthread"
            cmake --build out/dlss-linux --parallel 2
            cmake --install out/dlss-linux
            /opt/python/cp313-cp313/bin/python dev-tools/dlss_helper_smoke.py --library out/dlss-linux-install/libsuperluxcore_dlss.so --runtime .dlss-sdk/lib/Linux_x86_64/rel --elf-runtime .dlss-sdk/lib/Linux_x86_64/rel/libnvidia-ngx-dlssd.so.310.9.16 --out linux-helper-abi.json
          '
          docker image inspect quay.io/pypa/manylinux_2_28_x86_64 --format '{{json .RepoDigests}}' > manylinux-image-digest.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dlss-frame-linux-helper
          path: |
            linux-helper-abi.json
            manylinux-image-digest.json
            out/dlss-linux-install/*
